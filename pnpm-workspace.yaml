# pnpm 11 defaults strictDepBuilds to true, turning skipped dependency build
# scripts into a hard ERR_PNPM_IGNORED_BUILDS on a clean install (i.e. CI).
# msw, sharp, and unrs-resolver are all safe unbuilt — their native binaries
# ship as prebuilt @img/sharp-* and @unrs/resolver-binding-* optional deps — so
# we skip their build scripts and keep this a warning instead of a failure.
# (Note: the old `ignoredBuiltDependencies` key is a no-op in pnpm 11.)
strictDepBuilds: false

# Security floors for transitive deps (GHSA-h67p-54hq-rp68).
overrides:
  "js-yaml@<3.15.0": ">=3.15.0 <4"
  "js-yaml@>=4.0.0 <4.1.2": ">=4.1.2 <5"

# pnpm scaffolds this list on install and leaves the values as placeholders.
# esbuild, msw, sharp and unrs-resolver all ship prebuilt platform binaries as
# optional deps, so their build scripts are dead weight here. Prisma is allowed:
# @prisma/engines' postinstall is what places the schema engine the CLI needs
# for `db push` / `migrate`.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
